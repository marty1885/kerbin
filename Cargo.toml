[package]
name = "kerbin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "gzip", "brotli", "zstd", "deflate", "hickory-dns"] }
scraper = "0.24"
dom_smoothie = "0.18"
lru = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
hickory-resolver = "0.25"
encoding_rs = "0.8"
mime = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
flate2 = "1"
brotli = "9"
zstd = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[target.'cfg(target_os = "openbsd")'.dependencies]
priv_sep = "2.2"
libc = "0.2"
